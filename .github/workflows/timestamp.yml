name: OpenTimestamps

on:
  push:
    branches: [main]
    paths-ignore:
      - 'proofs/**'

jobs:
  timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTimestamps
        run: |
          pip install opentimestamps-client certifi
          echo "SSL_CERT_FILE=$(python -c 'import certifi; print(certifi.where())')" >> $GITHUB_ENV

      - name: Stamp commit hash
        run: |
          echo "${{ github.sha }}" | ots stamp -
          mkdir -p proofs
          mv stdin.ots proofs/${{ github.sha }}.ots

      - name: Commit proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proofs/
          git commit -m "ots: anchor ${{ github.sha }} [skip ci]"
          git push
